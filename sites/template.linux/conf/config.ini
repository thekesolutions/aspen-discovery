;
; default config file for customization
; Aspen Discovery Configuration
;

; No changes are necessary in the System Section
[System]
debug           = false
timings         = false
debugJs         = true
operatingSystem = linux

; This section will need to be customized for your installation
[Site]
siteName        = {sitename}
local           = /usr/local/aspen-discovery/code/web
fileGroupOwner  = {fileGroupOwner}
coverPath       = /data/aspen-discovery/{sitename}/covers
url             = {url}
; Optional address background processes use to call Aspen (e.g. the storage API) when the public
; url is not the right way to reach it from this server. It must reach this site by itself: with
; several sites on one server, use a hostname of this site that resolves locally (e.g. in /etc/hosts).
;internalUrl     =
title           = "{title}"
libraryName     = {library}
; Find valid timezone values here:
;   http://www.php.net/manual/en/timezones.php
timezone        = "{timezone}"

[Catalog]
driver               = {ilsDriver}
showFines            = true
url                  = {ilsUrl}
linking_url          = {ilsUrl}
staffClientUrl       = {ilsStaffUrl}

; This section requires no changes for most installations
[Index]
solrHost        = {solrHost}
solrPort        = {solrPort}
url             = http://{solrHost}:{solrPort}/solr

[Reindex]
marcPath             = /data/aspen-discovery/{sitename}/ils/marc
lexileExportPath     = /data/aspen-discovery/lexileTitles.txt

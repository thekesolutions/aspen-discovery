name: Comprehensive Test Suite

on:
  push:
    branches: [ main, develop, '*.*.00' ]
  pull_request:
    branches: [ main, develop, '*.*.00' ]

jobs:
  phpunit-tests:
    name: PHPUnit Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    strategy:
      matrix:
        php-version: ['8.4']  # Simplified to one version initially
        test-suite: ['unit']  # Simplified to unit tests initially

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker containers
        timeout-minutes: 10
        run: |
          cd tests
          PHP_VERSION=${{ matrix.php-version }} ./setup-container.sh

      - name: Run ${{ matrix.test-suite }} tests in Docker
        timeout-minutes: 5
        run: |
          cd tests
          PHP_VERSION=${{ matrix.php-version }} ./run-tests.sh ${{ matrix.test-suite }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-php${{ matrix.php-version }}-${{ matrix.test-suite }}
          path: |
            tests/phpunit/logs/junit-${{ matrix.test-suite }}.xml
            tests/phpunit/logs/coverage-${{ matrix.test-suite }}.xml
            tests/phpunit/logs/testdox.html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./tests/phpunit/logs/coverage-${{ matrix.test-suite }}.xml
          flags: ${{ matrix.test-suite }}
          name: php-${{ matrix.php-version }}-${{ matrix.test-suite }}

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysql, pdo_mysql, gd, curl, xml, mbstring

      - name: Check PHP syntax errors
        run: |
          find code/web -name "*.php" -exec php -l {} \; | grep -v "No syntax errors detected" || exit 0

      - name: Check for TODO/FIXME comments
        run: |
          if grep -r "TODO\|FIXME\|XXX" code/web --include="*.php" --exclude-dir=sys/Smarty --exclude-dir=sys/Parsedown; then
            echo "::warning::Found TODO/FIXME comments in code"
          fi

      - name: Validate test structure
        run: |
          # Ensure all test files follow naming convention
          find tests/phpunit/tests -name "*.php" ! -name "*Test.php" ! -name "*Tests.php" | while read file; do
            echo "::error::Test file '$file' does not follow naming convention (*Test.php or *Tests.php)"
            exit 1
          done


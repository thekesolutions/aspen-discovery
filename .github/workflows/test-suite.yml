  test-report:
    name: Test Report
    runs-on: ubuntu-latest
    needs: [phpunit-tests, code-quality]  # performance-benchmarks temporarily disabled
    if: always()

    steps:
      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-results

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: PHPUnit Test Results
          path: 'test-results/**/junit-*.xml'
          reporter: java-junit
          fail-on-error: true

      - name: Create test summary
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Count test result files
          UNIT_TESTS=$(find test-results -name "junit-unit.xml" | wc -l)
          INTEGRATION_TESTS=$(find test-results -name "junit-integration.xml" | wc -l)
          FUNCTIONAL_TESTS=$(find test-results -name "junit-functional.xml" | wc -l)
          PERFORMANCE_TESTS=$(find test-results -name "junit-performance.xml" | wc -l)
          
          echo "- Unit Tests: $UNIT_TESTS test suites" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: $INTEGRATION_TESTS test suites" >> $GITHUB_STEP_SUMMARY
          echo "- Functional Tests: $FUNCTIONAL_TESTS test suites" >> $GITHUB_STEP_SUMMARY
          echo "- Performance Tests: $PERFORMANCE_TESTS test suites" >> $GITHUB_STEP_SUMMARY